<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <title>
        Generator SPK
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- GENERATOR -->

    <div class="card shadow">

        <div class="card-body">

            <h3 class="mb-4">
                Generator SPK Lembur
            </h3>

            <!-- FILE -->

            <input
                type="file"
                id="fileInput"
                class="form-control mb-3"
            >

            <!-- BUTTON -->

            <div class="d-flex gap-2">

                <button
                    class="btn btn-secondary"
                    onclick="previewData()"
                >
                    Preview
                </button>

                <button
                    class="btn btn-primary"
                    onclick="generateSPK()"
                >
                    Generate
                </button>

            </div>

            <!-- STATUS -->

            <div
                id="status"
                class="mt-4"
            ></div>

            <!-- PREVIEW -->

            <div
                id="previewTable"
                class="mt-4"
            ></div>

        </div>

    </div>

    <!-- HISTORY -->

    <div class="card shadow mt-5">

        <div class="card-body">

            <h4 class="mb-3">
                History SPK
            </h4>

            <!-- SEARCH -->

            <input
                type="text"
                id="searchInput"
                class="form-control mb-3"
                placeholder="Search nomor / bidang / tanggal..."
                onkeyup="searchTable()"
            >

            <!-- TABLE -->

            <table
                class="table table-bordered"
                id="historyTable"
            >

                <thead>

                    <tr>

                        <th>Nomor</th>
                        <th>Tanggal</th>
                        <th>Bidang</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody>

                    {% for item in history %}

                    <tr>

                        <td>{{ item[0] }}</td>

                        <td>{{ item[1] }}</td>

                        <td>{{ item[2] }}</td>

                        <td>

                            <a
                                href="/download/{{ item[0] }}"
                                class="btn btn-sm btn-success"
                            >
                                Download
                            </a>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

async function previewData() {

    const file =
        document.getElementById(
            "fileInput"
        ).files[0];

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    const response =
        await fetch(
            "/preview",
            {
                method: "POST",
                body: formData
            }
        );

    const result =
        await response.json();

    let html = `
        <table class="table table-bordered">

            <thead>

                <tr>
                    <th>Tanggal</th>
                    <th>Bidang</th>
                    <th>Jumlah Pegawai</th>
                </tr>

            </thead>

            <tbody>
    `;

    result.data.forEach(item => {

        html += `

            <tr>

                <td>${item["Tanggal Lembur"]}</td>

                <td>${item["Keterangan"]}</td>

                <td>${item["Jumlah Pegawai"]}</td>

            </tr>

        `;
    });

    html += `
            </tbody>
        </table>
    `;

    document.getElementById(
        "previewTable"
    ).innerHTML = html;
}


async function generateSPK() {

    const file =
        document.getElementById(
            "fileInput"
        ).files[0];

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    document.getElementById(
        "status"
    ).innerHTML = `
        <div class="alert alert-info">
            Sedang generate...
        </div>
    `;

    try {

        const response =
            await fetch(
                "/generate",
                {
                    method: "POST",
                    body: formData
                }
            );

        if (!response.ok) {

            throw new Error(
                "Generate gagal"
            );
        }

        const blob =
            await response.blob();

        const url =
            window.URL.createObjectURL(
                blob
            );

        const a =
            document.createElement(
                "a"
            );

        a.href = url;

        a.download =
            "SPK_HASIL.zip";

        document.body.appendChild(
            a
        );

        a.click();

        a.remove();

        document.getElementById(
            "status"
        ).innerHTML = `
            <div class="alert alert-success">
                SPK berhasil dibuat.
            </div>
        `;

    } catch (error) {

        document.getElementById(
            "status"
        ).innerHTML = `
            <div class="alert alert-danger">
                Generate gagal.
            </div>
        `;
    }
}


function searchTable() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const filter =
        input.value.toLowerCase();

    const table =
        document.getElementById(
            "historyTable"
        );

    const tr =
        table.getElementsByTagName(
            "tr"
        );

    for (
        let i = 1;
        i < tr.length;
        i++
    ) {

        const rowText =
            tr[i]
            .innerText
            .toLowerCase();

        if (
            rowText.includes(filter)
        ) {

            tr[i].style.display = "";

        } else {

            tr[i].style.display =
                "none";
        }
    }
}

</script>

</body>
</html>
